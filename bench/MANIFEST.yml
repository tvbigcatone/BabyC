# BabyC unified bench manifest (W29rc migration)
# Columns (always): ats_no_accel, ats_accel, vm_no_accel, vm_accel, python, gcc
#
# tags: micro|classic|variant|real|stress + optional shape|recursion|anti-kernel|…
# gates: used by --gate filter

version: 1
defaults:
  runs: 5
  timeout: 120
  memo_off: true   # always BABYC_NO_MEMO=1

cases:
  # ── micro ──────────────────────────────────────────────
  - id: micro.array_sum
    path: cases/micro/array_sum.c
    tags: [micro]
    gates: [all, micro]
  - id: micro.dfs_rec
    path: cases/micro/dfs_rec.c
    tags: [micro, recursion]
    gates: [all, micro]
  - id: micro.fib_iter
    path: cases/micro/fib_iter.c
    tags: [micro]
    gates: [all, micro]
  - id: micro.fib_multiarg
    path: cases/micro/fib_multiarg.c
    tags: [micro]
    gates: [all, micro]
  - id: micro.isort
    path: cases/micro/isort.c
    tags: [micro, shape, insert-shift]
    gates: [all, micro, shape, honest]
  - id: micro.isort_decoy
    path: cases/micro/isort_decoy.c
    tags: [micro, shape, decoy]
    gates: [all, micro, shape, honest]
  - id: micro.list_walk
    path: cases/micro/list_walk.c
    tags: [micro]
    gates: [all, micro]
  - id: micro.matmul_small
    path: cases/micro/matmul_small.c
    tags: [micro]
    gates: [all, micro]
  - id: micro.string_scan
    path: cases/micro/string_scan.c
    tags: [micro, shape, ptr-scan]
    gates: [all, micro, shape, honest]
  - id: micro.string_scan_bounded
    path: cases/micro/string_scan_bounded.c
    tags: [micro, shape, ptr-scan]
    gates: [all, micro, shape, honest]
  - id: micro.struct_score
    path: cases/micro/struct_score.c
    tags: [micro]
    gates: [all, micro]

  # ── classic (ex serie1) ────────────────────────────────
  - id: classic.collatz
    path: cases/classic/collatz.c
    tags: [classic]
    gates: [all, classic, perf]
  - id: classic.crc
    path: cases/classic/crc.c
    tags: [classic]
    gates: [all, classic, perf]
  - id: classic.fib_rec
    path: cases/classic/fib_rec.c

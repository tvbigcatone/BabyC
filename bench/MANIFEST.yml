    gates: [all, classic, perf]
  - id: classic.gcd
    path: cases/classic/gcd.c
    tags: [classic]
    gates: [all, classic]
  - id: classic.hello
    path: cases/classic/hello.c
    tags: [classic, smoke]
    gates: [all, classic]
  - id: classic.isort
    path: cases/classic/isort.c
    tags: [classic]
    gates: [all, classic, perf]
  - id: classic.list
    path: cases/classic/list.c
    tags: [classic]
    gates: [all, classic]
  - id: classic.mandel
    path: cases/classic/mandel.c
    tags: [classic]
    gates: [all, classic]
  - id: classic.matmul
    path: cases/classic/matmul.c
    tags: [classic]
